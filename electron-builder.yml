appId: com.hagicode.electrondemo
productName: HagiCode Electron Demo
directories:
  buildResources: resources
  output: pkg
files:
  - dist/**/*
  - package.json
  - '!pkg/**/*'
  - '!dist/**/*.map'
asar: true
extraResources:
  - from: resources/icon.png
    to: icon.png
publish:
  provider: github
  owner: HagiCode-org
  repo: electron_demo
win:
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
    - target: appx
      arch:
        - x64
  icon: resources/icon.ico
nsis:
  runAfterFinish: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
appx:
  displayName: HagiCode Electron Demo
  publisherDisplayName: HagiCode
  publisher: CN=8B6C8A94-AAE5-4C8B-9202-A29EA42B042F
  identityName: HagiCodeOrg.ElectronDemo
  backgroundColor: transparent
  languages:
    - en-US
    - zh-CN
  addAutoLaunchExtension: false
  capabilities:
    - runFullTrust
    - internetClient
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  category: public.app-category.developer-tools
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: resources
  category: Development
