name: Reusable Unix Package Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      is_production_build:
        required: true
        type: boolean
      publish_release_assets:
        required: true
        type: boolean

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  build-unix:
    name: Build ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runs_on }}
    environment:
      name: ${{ inputs.is_production_build && 'production' || 'ci' }}
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: linux-appimage
            name: Linux AppImage
            platform: linux
            runs_on: ubuntu-latest
            command: npm run build:linux:appimage
            artifact_path: pkg/*.AppImage
          - id: linux-deb
            name: Linux DEB
            platform: linux
            runs_on: ubuntu-latest
            command: npm run build:linux:deb
            artifact_path: pkg/*.deb
          - id: linux-rpm
            name: Linux RPM
            platform: linux
            runs_on: ubuntu-latest
            command: npm run build:linux:rpm
            artifact_path: pkg/*.rpm
          - id: linux-tar-gz
            name: Linux tar.gz
            platform: linux
            runs_on: ubuntu-latest
            command: npm run build:linux:tar.gz
            artifact_path: pkg/*.tar.gz
          - id: linux-zip
            name: Linux ZIP
            platform: linux
            runs_on: ubuntu-latest
            command: npm run build:linux:zip
            artifact_path: pkg/*.zip
          - id: mac-x64-dmg
            name: macOS x64 DMG
            platform: mac
            runs_on: macos-15-intel
            command: npm run build:mac:x64:dmg
            artifact_path: pkg/*.dmg
          - id: mac-x64-zip
            name: macOS x64 ZIP
            platform: mac
            runs_on: macos-15-intel
            command: npm run build:mac:x64:zip
            artifact_path: pkg/*.zip
          - id: mac-arm64-dmg
            name: macOS arm64 DMG
            platform: mac
            runs_on: macos-14
            command: npm run build:mac:arm64:dmg
            artifact_path: pkg/*.dmg
          - id: mac-arm64-zip
            name: macOS arm64 ZIP
            platform: mac
            runs_on: macos-14
            command: npm run build:mac:arm64:zip
            artifact_path: pkg/*.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve macOS signing mode
        if: success() && matrix.target.platform == 'mac' && inputs.is_production_build
        id: mac_signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          if [[ -z "${CSC_LINK}" ]]; then
            missing+=('CSC_LINK')
          fi
          if [[ -z "${CSC_KEY_PASSWORD}" ]]; then
            missing+=('CSC_KEY_PASSWORD')
          fi

          has_api_key_auth=true
          for key in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!key}" ]]; then
              has_api_key_auth=false
            fi
          done

          has_apple_id_auth=true
          for key in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!key}" ]]; then
              has_apple_id_auth=false
            fi
          done

          if [[ "${has_api_key_auth}" != 'true' && "${has_apple_id_auth}" != 'true' ]]; then
            missing+=('APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER or APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID')
          fi

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            printf '::warning::Missing macOS release signing configuration: %s. Falling back to unsigned macOS build.\n' "$(IFS=', '; echo "${missing[*]}")"
            {
              echo '## macOS signing fallback'
              echo
              echo 'Production macOS signing configuration is incomplete. This job will publish unsigned macOS packages only.'
              echo
              echo 'Missing values:'
              for key in "${missing[@]}"; do
                echo "- ${key}"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Sync package version
        shell: bash
        run: |
          set -euo pipefail
          target_version="${{ inputs.version }}"
          current_version="$(node -p "require('./package.json').version")"

          if [[ "$current_version" == "$target_version" ]]; then
            echo "package.json version already matches $target_version"
            exit 0
          fi

          npm version "$target_version" --no-git-tag-version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi

            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi

            echo "npm ci failed on attempt ${attempt}; cleaning workspace and retrying..."
            rm -rf node_modules
            npm cache verify || true
            sleep $((attempt * 10))
          done

      - name: Install Linux packaging dependencies
        if: success() && matrix.target.id == 'linux-rpm'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm xz-utils

      - name: Build unsigned macOS packages
        if: success() && matrix.target.platform == 'mac' && inputs.is_production_build
        run: ${{ matrix.target.command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          WINAPP_CLI_TELEMETRY_OPTOUT: '1'

      - name: Preserve unsigned macOS artifacts
        if: success() && matrix.target.platform == 'mac' && inputs.is_production_build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/preserve-artifacts.js \
            --source-dir pkg \
            --artifact-path "${{ matrix.target.artifact_path }}" \
            --output-dir unsigned-artifacts \
            --suffix unsigned

      - name: Reset macOS package output for signed artifacts
        if: success() && matrix.target.platform == 'mac' && inputs.is_production_build && steps.mac_signing.outputs.enabled == 'true'
        shell: bash
        run: |
          rm -rf pkg
          mkdir -p pkg

      - name: Prepare macOS release signing environment
        if: success() && matrix.target.platform == 'mac' && inputs.is_production_build && steps.mac_signing.outputs.enabled == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "CSC_LINK=${CSC_LINK}"
            echo "CSC_KEY_PASSWORD=${CSC_KEY_PASSWORD}"
            echo "APPLE_API_KEY<<EOF"
            echo "${APPLE_API_KEY}"
            echo 'EOF'
            echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}"
            echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
            echo "APPLE_ID=${APPLE_ID}"
            echo "APPLE_APP_SPECIFIC_PASSWORD=${APPLE_APP_SPECIFIC_PASSWORD}"
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
          } >> "$GITHUB_ENV"

      - name: Build packages
        if: success() && (matrix.target.platform != 'mac' || !inputs.is_production_build || steps.mac_signing.outputs.enabled == 'true')
        run: ${{ matrix.target.command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.target.platform == 'mac' && steps.mac_signing.outputs.enabled == 'true' && 'true' || 'false' }}
          WINAPP_CLI_TELEMETRY_OPTOUT: '1'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target.id }}
          path: ${{ matrix.target.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish build artifacts to GitHub Release
        if: success() && inputs.publish_release_assets
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.target.artifact_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload unsigned macOS artifacts
        if: success() && matrix.target.platform == 'mac' && inputs.is_production_build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target.id }}-unsigned
          path: unsigned-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish unsigned macOS artifacts to GitHub Release
        if: success() && inputs.publish_release_assets && matrix.target.platform == 'mac' && inputs.is_production_build
        uses: softprops/action-gh-release@v3
        with:
          files: unsigned-artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
