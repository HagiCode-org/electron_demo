name: Build Electron Demo

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  prepare-release:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Resolve version from release drafter
        id: draft
        if: github.ref == 'refs/heads/main'
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          DRAFT_VERSION: ${{ steps.draft.outputs.resolved_version || '' }}
        run: |
          set -euo pipefail

          package_version='0.0.0'
          if [[ -f package.json ]]; then
            package_version="$(node -p "require('./package.json').version")"
          fi

          version="${package_version}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_REF}" == 'refs/heads/main' && -n "${DRAFT_VERSION}" ]]; then
            version="${DRAFT_VERSION}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build-package:
    name: Build ${{ matrix.target.name }}
    needs: prepare-release
    runs-on: ${{ matrix.target.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: linux-appimage
            name: Linux AppImage
            runs_on: ubuntu-latest
            command: npm run build:linux:appimage
            artifact_path: pkg/*.AppImage
          - id: linux-tar-gz
            name: Linux tar.gz
            runs_on: ubuntu-latest
            command: npm run build:linux:tar.gz
            artifact_path: pkg/*.tar.gz
          - id: linux-zip
            name: Linux ZIP
            runs_on: ubuntu-latest
            command: npm run build:linux:zip
            artifact_path: pkg/*.zip
          - id: win-portable
            name: Windows Portable
            runs_on: windows-2022
            command: npm run build:win:portable
            artifact_path: pkg/*.exe
          - id: win-nsis
            name: Windows NSIS
            runs_on: windows-2022
            command: npm run build:win:nsis
            artifact_path: pkg/*.exe
          - id: mac-x64-dmg
            name: macOS x64 DMG
            runs_on: macos-15-intel
            command: npm run build:mac:x64:dmg
            artifact_path: pkg/*.dmg
          - id: mac-x64-zip
            name: macOS x64 ZIP
            runs_on: macos-15-intel
            command: npm run build:mac:x64:zip
            artifact_path: pkg/*.zip
          - id: mac-arm64-dmg
            name: macOS arm64 DMG
            runs_on: macos-14
            command: npm run build:mac:arm64:dmg
            artifact_path: pkg/*.dmg
          - id: mac-arm64-zip
            name: macOS arm64 ZIP
            runs_on: macos-14
            command: npm run build:mac:arm64:zip
            artifact_path: pkg/*.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Sync package version
        shell: bash
        run: |
          set -euo pipefail
          target_version="${{ needs.prepare-release.outputs.version }}"
          current_version="$(node -p "require('./package.json').version")"

          if [[ "$current_version" == "$target_version" ]]; then
            echo "package.json version already matches $target_version"
            exit 0
          fi

          npm version "$target_version" --no-git-tag-version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: ${{ matrix.target.command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target.id }}
          path: ${{ matrix.target.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-package
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-artifacts/**/*
